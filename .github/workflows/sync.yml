name: Atualiza agenda e cópia da visão da banda
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gera pub.json e agendas a partir do Supabase
        run: python3 tools/sync_supabase.py
      - name: Salva se mudou
        run: |
          git config user.name "escala-b6-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pub.json agenda robots.txt sw.js
          git diff --cached --quiet || (git commit -m "Atualização automática (Supabase)" && git push)
