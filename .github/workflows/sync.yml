name: Atualiza agenda e cópia da visão da banda
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: publicar-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gera pub.json e agendas a partir do Supabase
        run: python3 tools/sync_supabase.py
      - name: Salva se mudou
        run: |
          git config user.name "escala-b6-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pub.json agenda robots.txt sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Atualização automática (Supabase)"
            # se alguém publicou no meio tempo, reaplica por cima e tenta de novo (até 5 vezes)
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && exit 0
              echo "push recusado, tentativa $i"; sleep $((i*5))
            done
            exit 1
          fi
      - name: Avisa se algo falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "⚠ Atualização automática do site falhou ($(date -u +%d/%m/%Y))" \
            --body "A atualização da cópia da visão da banda e das agendas falhou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
