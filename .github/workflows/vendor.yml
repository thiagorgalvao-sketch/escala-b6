name: Bibliotecas hospedadas no próprio site
# Baixa versões fixas das bibliotecas (npm, com verificação de integridade do próprio npm)
# e guarda em /vendor, para o site não depender de CDNs externos.
on:
  push:
    paths: ['tools/vendor.json', '.github/workflows/vendor.yml']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Baixa e verifica
        run: |
          set -e
          mkdir -p vendor /tmp/v && cd /tmp/v
          SB=$(jq -r '."@supabase/supabase-js"' $GITHUB_WORKSPACE/tools/vendor.json)
          PJ=$(jq -r '."pdfjs-dist"' $GITHUB_WORKSPACE/tools/vendor.json)
          JP=$(jq -r '."jspdf"' $GITHUB_WORKSPACE/tools/vendor.json)
          npm pack "@supabase/supabase-js@$SB" "pdfjs-dist@$PJ" "jspdf@$JP" >/dev/null
          for f in *.tgz; do mkdir -p "x_$f" && tar xzf "$f" -C "x_$f"; done
          cp x_supabase-supabase-js-$SB.tgz/package/dist/umd/supabase.min.js $GITHUB_WORKSPACE/vendor/supabase.min.js
          cp x_pdfjs-dist-$PJ.tgz/package/build/pdf.min.mjs $GITHUB_WORKSPACE/vendor/pdf.min.mjs
          cp x_pdfjs-dist-$PJ.tgz/package/build/pdf.worker.min.mjs $GITHUB_WORKSPACE/vendor/pdf.worker.min.mjs
          cp x_jspdf-$JP.tgz/package/dist/jspdf.umd.min.js $GITHUB_WORKSPACE/vendor/jspdf.umd.min.js
          cd $GITHUB_WORKSPACE/vendor
          python3 - <<'PY'
          import hashlib,base64,json,os
          v=json.load(open('../tools/vendor.json'))
          m={'versoes':v,'sri':{}}
          for f in sorted(os.listdir('.')):
              if f.endswith(('.js','.mjs')):
                  m['sri'][f]='sha384-'+base64.b64encode(hashlib.sha384(open(f,'rb').read()).digest()).decode()
          json.dump(m,open('manifest.json','w'),indent=1)
          print(json.dumps(m,indent=1))
          PY
      - name: Salva
        run: |
          git config user.name "escala-b6-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vendor
          git diff --cached --quiet || (git commit -m "Bibliotecas atualizadas (vendor)" && git pull --rebase && git push)
      - name: Avisa se algo falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "⚠ Falha ao baixar as bibliotecas do site" --body "Veja: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
