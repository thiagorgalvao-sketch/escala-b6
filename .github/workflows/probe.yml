name: Sonda temporária de cifras
on:
  push:
    paths: ['tools/probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe/p.sh
      - run: |
          git config user.name sonda; git config user.email sonda@x
          git checkout -q --orphan probe-out; git rm -rq --cached . ; git add out; git commit -qm out; git push -qf origin probe-out
