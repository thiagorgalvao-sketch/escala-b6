function bassT(t){return String(t||'').replace(/(^|[^A-Za-zÀ-ÿ#])([A-G][#b♯♭]?)(?:m(?!aj)|min|dim|°|ø)\d*(?![A-Za-zÀ-ÿ])/g,'$1$2')}
/* Corrige menores dos blocos importados (acordes só com a tônica) usando o campo harmônico do tom */
function mnFix(s){const ps=s.parts||[],all=ps.map(q=>q.chords||'').join('\n');if(!all.trim()||/[A-G][#b]?(m(?!aj)|min)/.test(all))return 0;let F;try{F=field(s.key)}catch(e){return 0}const mp={};F.c.forEach(c=>{const r=(c.match(/^[A-G][#b]?/)||[''])[0];if(r)mp[pk(r).pc]=c.slice(r.length)});let n=0;
 ps.forEach(q=>{if(!q.chords)return;q.chords=q.chords.split('\n').map(L=>{if(/frase|riff|baixo|linha|solo|nota/i.test(L))return L;const tk=L.split(/[\s_]+/).filter(Boolean),ck=tk.filter(t=>/^[(\[]?[A-G][#b]?[^a-zà-ÿ]*$/.test(t)).length;if(!tk.length||ck/tk.length<.6)return L;return L.replace(/(^|[^A-Za-zÀ-ÿ#\/\-])([A-G][#b]?)(?![A-Za-zÀ-ÿ0-9#\-\/])/g,(m0,a,r)=>{if(mp[pk(r).pc]==='m'){n++;return a+r+'m'}return m0}).replace(/(^|[^A-Za-zÀ-ÿ#\/\-])([A-G][#b]?)(\/[A-G][#b]?)(?![A-Za-zÀ-ÿ0-9#\-])/g,(m0,a,r,sl)=>{if(mp[pk(r).pc]==='m'){n++;return a+r+'m'+sl}return m0})}).join('\n')});return n}
